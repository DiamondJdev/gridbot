<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Gridbot</title>
    <link rel="icon" href="/mark.svg" type="image/svg+xml" />
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <header class="bar">
      <a class="brand" href="/">
        <img src="/mark.svg" alt="" width="20" height="20" />
        <span>Gridbot</span>
      </a>
      <p class="connection">
        <span class="dot" aria-hidden="true"></span>
        <span id="connection" data-state="connecting" aria-live="polite"
          >Connecting</span
        >
      </p>
    </header>
    <main class="canvas-area">
      <div class="title-row">
        <h1>Live simulation</h1>
        <p class="subline">
          Warehouse floor, north up. Pose source: simulator.
        </p>
      </div>
      <dl class="readouts">
        <div>
          <dt>Tick</dt>
          <dd id="tick">–</dd>
        </div>
        <div>
          <dt>Sim time</dt>
          <dd><span id="time">–</span><span class="unit"> s</span></dd>
        </div>
        <div>
          <dt>Collisions</dt>
          <dd id="collisions">–</dd>
        </div>
        <div>
          <dt>Path length</dt>
          <dd><span id="path">–</span><span class="unit"> m</span></dd>
        </div>
        <div>
          <dt>Pose source</dt>
          <dd>Simulator</dd>
        </div>
      </dl>
      <figure class="stage">
        <canvas
          id="stage"
          role="img"
          aria-label="Occupancy map with the robot and its lidar rays"
        ></canvas>
        <p id="empty" class="empty">Waiting for the simulator…</p>
        <figcaption>
          <span class="key"><span class="swatch wall"></span>Shelving</span>
          <span class="key"><span class="swatch robot"></span>Robot</span>
          <span class="key"><span class="swatch ray"></span>Lidar returns</span>
          <span class="scale">1 cell = 5 cm</span>
        </figcaption>
      </figure>
    </main>
  </body>
</html>
