name: Verify ROS

on:
  pull_request:
    paths:
      - "ros/**"
      - "core/**"
      - "scenarios/**"
      - "docker/ros.Dockerfile"
      - "docker/compose.yaml"
      - ".dockerignore"
      - ".github/workflows/verify-ros.yml"

permissions:
  contents: read

jobs:
  verify-ros:
    name: verify-ros
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: make verify-ros
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: failure()
        with:
          name: verify-ros-artifacts
          path: artifacts/
          if-no-files-found: ignore
