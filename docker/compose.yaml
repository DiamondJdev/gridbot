name: gridbot
services:
  gateway:
    image: gridbot-gateway:dev
    build:
      context: ..
      dockerfile: docker/gateway.Dockerfile
    profiles: [runner, ros]
    environment:
      GRIDBOT_RUNTIME_URL: ws://runner:8765
    # Only the gateway is published, and only on the host's loopback.
    # GRIDBOT_HOST_PORT=0 lets Docker pick a free port.
    ports:
      - "127.0.0.1:${GRIDBOT_HOST_PORT:-8080}:8080"
  runner:
    image: gridbot-runner:dev
    build:
      context: ..
      dockerfile: docker/runner.Dockerfile
    profiles: [runner]
  ros:
    image: gridbot-ros:dev
    build:
      context: ..
      dockerfile: docker/ros.Dockerfile
    profiles: [ros]
