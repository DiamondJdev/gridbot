repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: uv run ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: Ruff format
        entry: uv run ruff format --check
        language: system
        types: [python]
      - id: prettier
        name: Prettier
        entry: pnpm exec prettier --check
        language: system
        files: '\.(?:[cm]?[jt]sx?|json|ya?ml|md)$'
      - id: check-docs
        name: Documentation links and READMEs
        entry: uv run python scripts/check_docs.py
        language: system
        pass_filenames: false
        always_run: true
